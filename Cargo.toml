[package]
name = "luminal"
version = "0.2.0"
edition.workspace = true
rust-version = "1.85"
description = "Deep learning at the speed of light."
license = "MIT OR Apache-2.0"

[dependencies]
itertools = "0.11.0"
num-traits = "0.2.16"
petgraph = "0.6.4"
rand = "0.9.2"
urlencoding = "2.1.2"
open = "5"
dyn-clone = "1.0.12"
half = {version="2.7.1", features=["num-traits", "bytemuck"]}
tinyvec = { version = "1.6.0", features = ["serde"] }
colored = "2.0.4"
regex = "1.9.5"
rustc-hash = "2.1.1"
as-any = "0.3.1"
serde = { version = "1.0.202", features = ["derive"] }
generational-box = "0.5.6"
serde_json = "1.0.140"
egglog = {git="https://github.com/egraphs-good/egglog", rev="53b9721b9706741edff2b7c1e379fc37137184d9"}
egglog-ast = {git="https://github.com/egraphs-good/egglog", rev="53b9721b9706741edff2b7c1e379fc37137184d9"}
# egglog-reports: crate absorbed upstream; RunReport types re-export via egglog (pin bump 2026-08-11)
egraph-serialize = { version = "0.3.0", default-features = false, features = ["graphviz", "serde"]}
tracing = "0.1.43"
paste = "1.0.15"
pretty-duration = "0.1.1"
anyhow = "1.0"
graphviz-rust = { version = "0.9", default-features = false}
lru = "0.16.2"
rayon = "1.10"

[workspace.package]
edition = "2024"

[dev-dependencies]
luminal_nn = { path = "crates/luminal_nn" }
candle-core = "0.9.2"
candle-nn = "0.9.2"
ordered-float = "5.1.0"
proptest = "1.9.0"

[workspace]
# M3 Step 4b: their HLIR pipeline is deleted. Crates and examples that
# consumed it (cuda_lite/metal/python/training/bench + the model-zoo
# examples) are PARKED — out of the workspace until their M4/4d re-seat
# on the native ladder. They are not deleted; their sources stay put.
members = [
    "crates/luminal_nn",
    "crates/luminal_tracing",
]

[patch.crates-io]
candle-kernels = { git = "https://github.com/huggingface/candle.git", rev = "a0dbd8b8aef6bde9adca3e8ad90791609d64974b" }

# Mini-model demos (ruling 2026-08-07): models are DEFINED in core
# (crates/luminal_nn); these runners belong to the reference runtime and
# live in examples/mini/ beside the full-size example models.
[[example]]
name = "mini_llama3"
path = "examples/mini/llama3/main.rs"

[[example]]
name = "mini_qwen3"
path = "examples/mini/qwen3/main.rs"

[[example]]
name = "mini_gemma3"
path = "examples/mini/gemma3/main.rs"

[[example]]
name = "mini_qwen3_moe"
path = "examples/mini/qwen3_moe/main.rs"

[[example]]
name = "mini_gemma4_moe"
path = "examples/mini/gemma4_moe/main.rs"

[[example]]
name = "mini_flux"
path = "examples/mini/flux/main.rs"

[[example]]
name = "mini_whisper"
path = "examples/mini/whisper/main.rs"

[[example]]
name = "mini_conv"
path = "examples/mini/conv/main.rs"
