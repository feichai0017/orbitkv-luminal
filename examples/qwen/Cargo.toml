[package]
name = "qwen"
version = "0.2.0"
edition.workspace = true

[[bin]]
name = "qwen"
path = "src/main.rs"

# The pure-logical exemplar (conversion directive 2026-08-10): the model
# is authored in logical ops only and runs on the SSA reference runtime
# through the native ladder. No backend features — GPU runtimes return
# with the cuda_lite/metal M4 re-seat, binding the same logical graph.
[dependencies]
luminal = { path = "../.." }
luminal_nn = { path = "../../crates/luminal_nn" }
rustc-hash = "2.1"
tokenizers = "0.22.2"

# HuggingFace model download + weight repack (host-side only)
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"] }
safetensors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
half = { version = "2.7.1", features = ["bytemuck"] }
bytemuck = "1.24.0"
memmap2 = "0.9.9"
