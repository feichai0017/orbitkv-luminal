[package]
name = "whisper"
version = "0.2.0"
edition.workspace = true

[[bin]]
name = "whisper"
path = "src/main.rs"

# Pure-logical zoo conversion (rulings 2026-08-12): exactly
# openai/whisper-tiny.en — conv frontend, stored sinusoidal + learned
# position tables, torch LayerNorm with bias, the HF projection-bias
# asymmetry, uncached cross-attention; slot-pool decoder self-cache.
[dependencies]
luminal = { path = "../.." }
luminal_nn = { path = "../../crates/luminal_nn" }
rustc-hash = "2.1"
tokenizers = "0.22.2"

hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"] }
safetensors = "0.7.0"
half = { version = "2.7.1", features = ["bytemuck"] }
bytemuck = "1.24.0"
memmap2 = "0.9.9"

# Host audio pipeline (WAV decode + log-mel)
hound = "3.5"
rustfft = "6.2"
