[project]
name = "luminal_python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.2",
    "torch>=2.10.0",
    "onnx",
    "onnxscript",
    "safetensors",
    "flash-attn-3>=3.0.0",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
flash-attn-3 = { index = "pytorch-cu128" }


[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "luminal.luminal"

[tool.pytest.ini_options]
markers = [
    "slow: tests that download large models or require pre-generated artifacts",
]

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "maturin-import-hook>=0.3.0",
    "pytest>=9.0.2",
    "pytest-profiling",
    "snakeviz",
    "pytest-randomly>=4.0.1",
    "transformers>=5.5.0,<6",
    "diffusers>=0.35.0",
    "onnxsim",
    "tiktoken>=0.12.0",
    "pydantic>=2.12.5",
    "psutil>=7.2.2",
    "modal>=1.3.5",
    "pillow",
    "flash-attn>=2.8.3",
]
flash-attention-4 = [
    "nvidia-cutlass-dsl==4.1.0",
]
