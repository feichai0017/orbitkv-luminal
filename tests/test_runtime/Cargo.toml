[package]
name = "test_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
luminal = { path = "../.." }
luminal_reference = { path = "../../crates/luminal_reference" }
# Train 3 (op-ownership move): the cuBLASLt marker estate lives in the
# CUDA-lite crate now (`ops/cublaslt`); this is a CPU-side dependency —
# CL compiles fully without its `device` feature.
luminal_cuda_lite = { path = "../../crates/luminal_cuda_lite" }
# Versions track luminal's Cargo.toml exactly — the egglog/egraph-serialize/
# petgraph types must UNIFY with luminal's so the fixture runners can hand
# this crate's egraphs to luminal's extractor and bufferizer.
egglog = { git = "https://github.com/egraphs-good/egglog", rev = "c2c0f1510a3633b768fb3d30ad284b211290e4b2" }
rustc-hash = "2.1.1"
anyhow = "1.0"
